services:
  app:
    build: .
    container_name: slim_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor # tetap boleh dipakai
    user: "${UID}:${GID}" # 🔥 INI KUNCI UTAMA
    networks:
      - slim-network

  web:
    image: nginx:alpine
    container_name: slim_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - slim-network

networks:
  slim-network:
    driver: bridge
